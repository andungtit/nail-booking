spring.application.name=nail-backend

# Đọc biến môi trường từ file .env ở thư mục chạy (nail-backend/.env)
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8282}

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/nailroom?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ---------- Admin auth ----------
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.token-secret=${ADMIN_TOKEN_SECRET:change-me-please-nailroom-secret-key}
app.admin.token-ttl-hours=${ADMIN_TOKEN_TTL_HOURS:12}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173}

# ---------- Seed dữ liệu mẫu (lấy từ book.nailroom.vn) khi DB trống ----------
app.seed.enabled=${SEED_ENABLED:true}
